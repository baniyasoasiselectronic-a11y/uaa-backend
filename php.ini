; Railpack replaces its own default php.ini entirely with this file (it does
; NOT merge the two) — see https://railpack.com/languages/php/. Deliberately
; minimal: only the directives below are actually being overridden here;
; everything else falls back to PHP's normal compiled-in defaults, same as
; if this file didn't exist. Extension loading is handled separately by
; Railpack/Railway (composer.json requirements + RAILPACK_PHP_EXTENSIONS)
; and is unaffected by this file.
;
; config/livewire.php's temporary_file_upload rule already assumes a ~30M
; ceiling ("max:28000" KB, deliberately just under it), but nothing was
; actually setting php.ini's own limits — so real photo uploads (phone
; cameras routinely produce 5-20MB JPEGs) were being silently truncated by
; PHP itself before any application code ever ran, which is what caused
; uploaded images to save as 0 bytes.
upload_max_filesize = 32M
post_max_size = 34M
max_execution_time = 120
memory_limit = 512M
